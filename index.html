<body>

<script>
(function(){
'use strict';
const KEY='nisnil_tax_console_v1';
const INR=n=>(n<0?'(':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN')+(n<0?')':'');
const N=v=>{const x=Number(String(v==null?'':v).replace(/[,₹\s]/g,''));return isFinite(x)?x:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- storage ---------- */
let mem=null;
const CFG=window.TAX_CONFIG||{};
const LIVE=!!CFG.TAX_API;
function load(){if(LIVE)return null;try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return mem}
function persist(){if(LIVE)return;mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function seed(){
  const base={age:'below60',salary:0,exemptAllow:0,profTax:0,hpType:'none',rent:0,municipal:0,hpInterest:0,savingsInt:0,fdInt:0,dividend:0,otherInc:0,biz:0,stcg111A:0,ltcg112A:0,ltcgOther:0,stcgOther:0,d80C:0,d80CCD1B:0,d80D:0,d80G:0,dOther:0,d80CCD2:0,tds:0,tcs:0,advTax:0,saTax:0};
  const mk=(o,f)=>Object.assign({id:uid(),docs:[],prefill:false,comp:null,sent:false,approval:'none',reason:'',pay:{state:'unpaid',method:'',utr:''},fee:0,feeReq:null,credit:false,filed:null,everified:false,delivered:false,cred:null,assigned:'Preparer 1'},o,{f:Object.assign({},base,f)});
  return {
    settings:{fees:{'ITR-1':999,'ITR-2':1999,'ITR-3':2999,'ITR-4':1499},ay:'AY 2027-28',master:'familyfi.app@gmail.com',vault:null,qr:null,qrNote:'',upi:''},
    team:[{name:'Preparer 1',email:'preparer1@gmail.com',active:true}],
    log:[{t:now(),who:'System',x:'Test build created with sample clients'}],
    clients:[
      mk({fee:1499,docs:[{n:'Form16_2026-27.pdf',d:now()},{n:'Bank_interest.pdf',d:now()},{n:'80C_proofs.pdf',d:now()}],prefill:true},{name:'Sample Client A',pan:'ABCPX1234X',email:'clienta@gmail.com',phone:'98XXXXXX01',itr:'ITR-1',salary:1400000,savingsInt:4200,d80C:150000,d80D:25000,tds:85000}),
      mk({fee:3499,docs:[{n:'Form16.pdf',d:now()},{n:'Broker_CG_statement.pdf',d:now()}],prefill:true},{name:'Sample Client B',pan:'ABCPY5678Y',email:'clientb@gmail.com',phone:'98XXXXXX02',itr:'ITR-2',salary:2200000,stcg111A:60000,ltcg112A:210000,fdInt:38000,d80C:150000,tds:310000}),
      mk({fee:2999,docs:[{n:'Bank_statements.pdf',d:now()}],prefill:true},{name:'Sample Client C',pan:'ABCPZ9012Z',email:'clientc@gmail.com',phone:'98XXXXXX03',itr:'ITR-4',biz:900000,savingsInt:12000,d80C:100000,advTax:20000}),
      mk({fee:1499},{name:'Sample Client D',pan:'ABCPW3456W',email:'clientd@gmail.com',phone:'98XXXXXX04',itr:'ITR-1'})
    ]
  };
}
let DB=LIVE?{settings:{fees:{},ay:'',master:'',vault:null,qr:null,qrNote:'',upi:''},team:[],clients:[],log:[]}:(load()||seed());
if(!('qr' in DB.settings)){DB.settings.qr=null;DB.settings.qrNote='';DB.settings.upi=''}
DB.team.forEach(t=>{if(t.active===undefined)t.active=true;delete t.modules});
persist();


/* ---------- UI state ---------- */
const S={role:LIVE?null:'owner',view:'dash',emp:null,me:null,snap:null,notes:[],busy:0,cur:null,clientAs:null,tab:'All',vaultKey:null,reveal:{},q:''};
/* ---------- live server + Google sign-in ---------- */
let auth=null,tokenClient=null,pendingAuth=[];
try{const a0=JSON.parse(sessionStorage.getItem('nn_tax_auth')||'null');if(a0&&a0.exp>Date.now()+60000)auth=a0}catch(e){}
function tokenOk(){return !!(auth&&auth.tok&&auth.exp>Date.now()+60000)}
function gsiClient(){
  if(tokenClient)return tokenClient;
  if(!(window.google&&google.accounts&&google.accounts.oauth2))throw new Error('Google sign-in did not load. Check your internet and reload.');
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CFG.CLIENT_ID,scope:'openid email',
    callback:r=>{if(!r||r.error||!r.access_token){const e=new Error((r&&(r.error_description||r.error))||'Sign-in was cancelled.');const w=pendingAuth;pendingAuth=[];w.forEach(x=>x.rej(e));return}
      auth={tok:r.access_token,exp:Date.now()+Number(r.expires_in||3600)*1000};try{sessionStorage.setItem('nn_tax_auth',JSON.stringify(auth))}catch(e){}
      const w=pendingAuth;pendingAuth=[];w.forEach(x=>x.res(auth.tok))},
    error_callback:e=>{const w=pendingAuth;pendingAuth=[];w.forEach(x=>x.rej(new Error(e&&e.type==='popup_closed'?'The Google window was closed before sign-in finished.':'Sign-in failed.')))}});
  return tokenClient;
}
function signIn(){return new Promise((res,rej)=>{pendingAuth.push({res,rej});try{gsiClient().requestAccessToken({prompt:'select_account'})}catch(e){const w=pendingAuth;pendingAuth=[];w.forEach(x=>x.rej(e))}})}
function signOut(){try{if(auth)google.accounts.oauth2.revoke(auth.tok,()=>{})}catch(e){}try{sessionStorage.removeItem('nn_tax_auth')}catch(e){}auth=null;S.role=null;S.me=null;S.vaultKey=null;S.reveal={};render()}
function busy(on){S.busy=Math.max(0,S.busy+(on?1:-1));const b=document.getElementById('busy');if(b)b.style.display=S.busy?'block':'none'}
async function api(fn,arg){
  if(!tokenOk())throw Object.assign(new Error('Please sign in again.'),{code:'AUTH'});
  busy(true);
  try{
    const r=await fetch(CFG.TAX_API,{method:'POST',body:JSON.stringify({fn,token:auth.tok,args:[arg]}),redirect:'follow'});
    const o=await r.json();
    if(o&&o.ok)return o.data;
    const e=new Error((o&&o.error)||'The server did not answer. Try again.');e.code=o&&o.code;throw e;
  }catch(e){if(e&&e.message==='Failed to fetch')throw new Error('Could not reach the server. Check your internet.');throw e}
  finally{busy(false)}
}
function apply(v){
  S.me=v.me;S.role=v.me.role;
  if(v.db){DB=v.db;S.snap=snapOf(DB)}
  if(S.role==='employee'||S.role==='owner'){if(S.view==='dash'&&S.role==='employee')S.view='queue'}
  render();
}
function snapOf(d){const m={};d.clients.forEach(c=>m[c.id]=JSON.stringify(c));return {c:m,settings:JSON.stringify(d.settings),team:JSON.stringify(d.team)}}
async function boot(){
  if(!LIVE){render();return}
  if(!tokenOk()){render();return}
  try{apply(await api('load'))}catch(e){if(e.code==='AUTH'){auth=null;try{sessionStorage.removeItem('nn_tax_auth')}catch(x){}}toast(e.message);render()}
}
async function liveSave(){
  const sn=S.snap||{c:{},settings:'',team:''};
  const p={clients:DB.clients.filter(c=>sn.c[c.id]!==JSON.stringify(c)),deleted:Object.keys(sn.c).filter(id=>!C(id)),notes:S.notes.splice(0)};
  if(S.role!=='client'&&JSON.stringify(DB.settings)!==sn.settings)p.settings=DB.settings;
  if(S.role==='owner'&&JSON.stringify(DB.team)!==sn.team)p.team=DB.team;
  if(!p.clients.length&&!p.deleted.length&&!p.settings&&!p.team&&!p.notes.length)return;
  try{apply(await api('sync',p))}catch(e){toast(e.code==='AUTH'?'Sign-in expired: please sign in again':'Not saved: '+e.message);if(e.code==='AUTH'){auth=null}else{try{apply(await api('load'))}catch(x){}}}
}
async function fileB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)})}
async function uploadFiles(c,files,kind){
  for(const f of files){
    if(f.size>10*1024*1024){toast(f.name+' is over 10 MB');continue}
    try{const b64=await fileB64(f);apply(await api('upload',{id:c.id,name:f.name,mime:f.type,b64,kind}))}catch(e){toast('Upload failed: '+e.message)}
  }
}
function driveToken(){return new Promise((res,rej)=>{try{const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>r&&r.access_token?res(r.access_token):rej(new Error((r&&r.error)||'Drive permission was not given')),error_callback:()=>rej(new Error('The Google window was closed'))});tc.requestAccessToken({prompt:'',login_hint:S.me?S.me.email:''})}catch(e){rej(e)}})}
async function driveCreate(tok,meta,blob){
  let r;
  if(blob){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));fd.append('file',blob);r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+tok},body:fd})}
  else r=await fetch('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(meta)});
  if(!r.ok)throw new Error('Google Drive refused the file ('+r.status+')');return r.json();
}
async function saveToDrive(c){
  if(!LIVE){toast('Demo: Google Drive saving works on tax.nisnil.co.in');return}
  const tok=await driveToken();
  busy(true);
  try{
    const folder=await driveCreate(tok,{name:'Nisnil ITR – '+DB.settings.ay+' – '+c.f.name,mimeType:'application/vnd.google-apps.folder'});
    if(c.itrv&&c.itrv.fid){const r=await api('getFile',{id:c.id,fid:c.itrv.fid});const bin=atob(r.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await driveCreate(tok,{name:r.name,parents:[folder.id]},new Blob([u],{type:r.mime||'application/pdf'}))}
    const html='<html><head><meta charset="utf-8"></head><body style="font-family:Arial">'+compSheet(c,true).replace(/<button[^>]*>.*?<\/button>/g,'')+'<p>Acknowledgement: '+esc(c.filed?c.filed.ack:'')+'</p></body></html>';
    await driveCreate(tok,{name:'Computation – '+c.f.name+' – '+DB.settings.ay,mimeType:'application/vnd.google-apps.document',parents:[folder.id]},new Blob([html],{type:'text/html'}));
    c.driveSaved={d:now(),link:folder.webViewLink||''};log('Client saved ITR-V and computation to their Google Drive','Client · '+c.f.name);save();toast('Saved to your Google Drive');
  }finally{busy(false)}
}
function saveBlob(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function openFile(id,fid){
  try{const r=await api('getFile',{id,fid});const bin=atob(r.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);saveBlob(r.name,new Blob([u],{type:r.mime}))}catch(e){toast('Could not open: '+e.message)}
}
const docRow=(c,d)=>'<div class="row between" style="border-bottom:1px solid #F1F2F4;padding:6px 0"><span>'+esc(d.n)+'</span><span class="row"><span class="muted">'+esc(d.d)+(d.by?' · '+esc(d.by):'')+'</span>'+(LIVE&&d.fid?'<button class="btn" data-a="openFile" data-v="'+c.id+'" data-fid="'+esc(d.fid)+'">Open</button>':'')+'</span></div>';
const itrvName=c=>c.itrv?(c.itrv.n||c.itrv):'';

function empName(){if(LIVE)return S.me?S.me.name:'Employee';const t=DB.team.find(x=>x.email.toLowerCase()===S.emp);return t?t.name:'Employee'}
function log(x,who){if(LIVE){S.notes.push(String(x));return}DB.log.unshift({t:now(),who:who||(S.role==='owner'?'Owner':S.role==='employee'?empName():'Client'),x});DB.log=DB.log.slice(0,300)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const C=id=>DB.clients.find(c=>c.id===id);

/* ---------- tax engine (FY 2026-27 / AY 2027-28 and FY 2025-26 / AY 2026-27: same slabs) ---------- */
const SLABS={
  new:[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]],
  old_below60:[[250000,0],[500000,.05],[1000000,.20],[Infinity,.30]],
  old_60to79:[[300000,0],[500000,.05],[1000000,.20],[Infinity,.30]],
  old_80plus:[[500000,0],[1000000,.20],[Infinity,.30]]
};
function slab(inc,s){let t=0,prev=0;for(const [lim,r] of s){if(inc>prev){t+=(Math.min(inc,lim)-prev)*r}prev=lim}return t}
function compute(f,regime){
  const old=regime==='old';const sl=old?SLABS['old_'+f.age]:SLABS.new;const exLimit=sl[0][0];
  const sal=N(f.salary);const std=sal>0?Math.min(sal,old?50000:75000):0;
  const exA=old?N(f.exemptAllow):0;const pt=old?N(f.profTax):0;
  const salInc=Math.max(0,sal-exA-std-pt);
  let hp=0;
  if(f.hpType==='self'){hp=old?-Math.min(N(f.hpInterest),200000):0}
  else if(f.hpType==='let'){const nav=Math.max(0,N(f.rent)-N(f.municipal));hp=nav*0.7-N(f.hpInterest);hp=old?Math.max(hp,-200000):Math.max(hp,0)}
  const oth=N(f.savingsInt)+N(f.fdInt)+N(f.dividend)+N(f.otherInc);
  const biz=N(f.biz);const stO=N(f.stcgOther);
  const normal=Math.max(0,salInc+hp+oth+biz+stO);
  const s111=N(f.stcg111A),l112=N(f.ltcg112A),lO=N(f.ltcgOther);
  const special=s111+l112+lO;
  const gti=normal+special;
  let ded=N(f.d80CCD2);
  if(old){
    const tta=f.age==='below60'?Math.min(N(f.savingsInt),10000):Math.min(N(f.savingsInt)+N(f.fdInt),50000);
    ded+=Math.min(N(f.d80C),150000)+Math.min(N(f.d80CCD1B),50000)+N(f.d80D)+N(f.d80G)+N(f.dOther)+tta;
  }
  ded=Math.min(ded,normal);
  const normalTI=Math.round(Math.max(0,normal-ded)/10)*10;
  const total=normalTI+special;
  const taxN=slab(normalTI,sl);
  let unused=Math.max(0,exLimit-normalTI);
  const a1=Math.min(unused,s111);unused-=a1;
  const t111=0.20*Math.max(0,s111-a1);
  const l112tax=Math.max(0,l112-125000);const a2=Math.min(unused,l112tax);unused-=a2;
  const t112=0.125*Math.max(0,l112tax-a2);
  const tLO=0.125*Math.max(0,lO-Math.min(unused,lO));
  const taxS=t111+t112+tLO;
  let reb=0,mr=0;
  if(old){if(total<=500000)reb=Math.min(taxN+taxS,12500)}
  else{
    if(total<=1200000)reb=Math.min(taxN,60000);
    else if(special===0&&taxN>total-1200000)mr=taxN-(total-1200000);
  }
  const before=Math.max(0,taxN+taxS-reb-mr);
  let sr=0;
  if(total>50000000)sr=old?.37:.25;else if(total>20000000)sr=.25;else if(total>10000000)sr=.15;else if(total>5000000)sr=.10;
  const srSpecial=Math.min(sr,.15);
  const surch=total>5000000?Math.max(0,(taxN-reb-mr))*sr+taxS*srSpecial:0;
  const cess=(before+surch)*0.04;
  const liab=Math.round((before+surch+cess)/10)*10;
  const paid=N(f.tds)+N(f.tdsOthAmt)+N(f.tcs)+N(f.advTax)+N(f.saTax);
  return {regime,sal,exA,std,pt,salInc,hp,oth,biz,stO,special,s111,l112,lO,gti,ded,total,taxN,taxS,reb,mr,surch,cess,liab,paid,net:liab-paid,surchargeNote:total>5000000};
}
function both(f){const o=compute(f,'old'),n=compute(f,'new');return {o,n,best:n.liab<=o.liab?'new':'old',save:Math.abs(o.liab-n.liab)}}
function suggestITR(f){
  if(N(f.biz)>0)return 'ITR-4';
  const r=compute(f,'new');
  if(r.total>5000000||N(f.stcg111A)>0||N(f.ltcgOther)>0||N(f.stcgOther)>0||N(f.ltcg112A)>125000||f.hpType==='let'&&N(f.rent)>0&&false)return 'ITR-2';
  return 'ITR-1';
}

/* ---------- status ---------- */
const FLOW=['New','Docs uploaded','Computation ready','Sent to client','Approved','Cleared to file','Filed','E-verified','Delivered'];
function paidOrFree(c){return c.pay.state==='paid'||(c.fee===0&&c.feeReq&&c.feeReq.state==='approved')}
function cleared(c){return c.pay.state==='paid'||(c.fee===0&&c.feeReq&&c.feeReq.state==='approved')||c.credit}
function status(c){
  if(c.delivered)return 'Delivered';
  if(c.everified)return 'E-verified';
  if(c.filed)return 'Filed';
  if(c.approval==='rejected')return 'Rejected';
  if(c.approval==='approved')return cleared(c)?'Cleared to file':'Awaiting payment';
  if(c.sent)return 'Sent to client';
  if(c.comp)return 'Computation ready';
  if(c.docs.length||c.prefill)return 'Docs uploaded';
  return 'New';
}
const PILL={'New':['#F3F4F6','#374151'],'Docs uploaded':['#E0F2FE','#075985'],'Computation ready':['#EDE9FE','#5B21B6'],'Sent to client':['#EDE9FE','#5B21B6'],'Approved':['#DCFCE7','#166534'],'Rejected':['#FEE2E2','#991B1B'],'Awaiting payment':['#FEF3C7','#92400E'],'Cleared to file':['#DCFCE7','#166534'],'Filed':['#E6F4F1','#115E59'],'E-verified':['#E6F4F1','#115E59'],'Delivered':['#E6F4F1','#115E59']};
const pill=(t,k)=>{const p=PILL[k||t]||['#F3F4F6','#374151'];return '<span class="pill" style="background:'+p[0]+';color:'+p[1]+'">'+esc(t)+'</span>'};
function payLabel(c){
  if(c.pay.state==='paid')return pill('Paid · '+(c.pay.method||'—'),'Approved');
  if(c.pay.state==='verifying')return pill((c.pay.method||'Payment')+' · verifying','Docs uploaded');
  if(c.fee===0&&c.feeReq&&c.feeReq.state==='approved')return pill('Free (approved)','Filed');
  if(c.credit)return pill('Pay later (approved)','Awaiting payment');
  return pill('Unpaid','Awaiting payment');
}

/* ---------- vault (AES-GCM, key from passphrase) ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encStr(key,s){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(s));return {iv:b64(iv),ct:b64(ct)}}
async function decStr(key,o){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct));return dec.decode(pt)}

function checks(c,B,sug){
  const f=c.f;const it=[];
  const ok=(t)=>it.push(['✓','#DCFCE7','#166534',t]),w=(t)=>it.push(['!','#FEF3C7','#92400E',t]),p=(t)=>it.push(['○','#F3F4F6','#374151',t]);
  /^[A-Z]{5}[0-9]{4}[A-Z]$/.test(f.pan||'')?ok('PAN format valid'):w('PAN format looks wrong');
  N(f.tds)>0?ok('TDS entered: match it with 26AS'):w('No TDS entered: confirm with 26AS / AIS');
  sug!==f.itr?w('Income mix suggests '+sug+' (chosen '+f.itr+')'):ok(f.itr+' fits the income entered');
  c.comp?ok('Computation saved: '+(c.comp.regime==='new'?'new':'old')+' regime'):p('Computation not saved yet');
  w('Foreign assets? Ask client. Schedule FA is mandatory for residents with any foreign asset');
  N(f.savingsInt)+N(f.fdInt)===0?w('No interest income: AIS usually shows some, so check'):ok('Interest income included');
  c.approval==='approved'?ok('Client approved computation'):p('Client approval pending');
  return it.map(([m,bg,fg,t])=>'<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="pill" style="background:'+bg+';color:'+fg+';min-width:24px;text-align:center">'+m+'</span><span>'+esc(t)+'</span></div>').join('');
}

  L('Income from salary',r.salInc)+L('House property',r.hp)+L('Other sources',r.oth)+L('Business (presumptive)',r.biz)+L('Capital gains',r.stO+r.special)+L('Gross total income',r.gti,1)+L('Less: deductions',-r.ded)+L('Total income',r.total,1)+L('Tax on total income',r.taxN+r.taxS)+L('Less: rebate / relief',-(r.reb+r.mr))+L('Surcharge',r.surch)+L('Cess 4%',r.cess)+L('Total tax liability',r.liab,1)+L('Less: TDS / taxes paid',-r.paid)+L(r.net<0?'Refund due':'Tax payable',Math.abs(r.net),1)+
  '</tbody></table></div><span class="muted">Prepared by Nisnil Tax</span>';
}

/* ---------- prefill parser (best effort) ---------- */
function walk(o,fn,path){if(o&&typeof o==='object'){for(const k in o){const v=o[k];fn(k,v,path);walk(v,fn,(path||'')+'.'+k)}}}
function parsePrefill(j){
  const found={};const take=(name,v)=>{if(found[name]==null&&v!=null&&v!=='')found[name]=v};
  walk(j,(k,v)=>{
    const K=k.toLowerCase();
    if(typeof v==='object')return;
    if(K==='pan'||K==='assesseepan')take('pan',String(v).toUpperCase());
    else if(K==='firstname')take('first',v);
    else if(K==='surnameororgname'||K==='lastname')take('last',v);
    else if(K==='dob'||K==='dateofbirth')take('dob',v);
    else if(K==='emailaddress'||K==='email')take('email',v);
    else if(K==='grosssalary'||K==='totalgrosssalary')take('salary',N(v));
    else if(K.includes('intrstfrmsavingbank')||K.includes('interestfromsaving')||K==='savingsbankinterest')take('savingsInt',N(v));
    else if(K.includes('intrstfrmtermdeposit')||K.includes('interestfromdeposit'))take('fdInt',N(v));
    else if(K==='totaltdsonsalaries'||K==='totaltaxdeducted'||K==='totaltds'||K==='tdsonsalary')take('tds',N(v));
    else if(K==='dividendincome'||K==='dividend')take('dividend',N(v));
  });
  return found;
}

    case 'feeReq':{const t=val('frt'),amt=N(val('fra')),r=val('frr');if(!r){toast('Add a reason');break}if(t==='Discount'&&!(amt>0&&amt<c.fee)){toast('Enter a discounted amount below the current fee');break}

      const txt=JSON.stringify(out,null,2);log('Generated draft JSON for '+c.f.name);persist();
      modal('<div class="row between"><h2>Draft JSON · '+esc(c.f.name)+'</h2><button class="btn" data-a="close">Close</button></div><div class="note warn">Draft for checking only. Not in the official portal schema yet.</div><textarea class="code" readonly id="jt">'+esc(txt)+'</textarea><div class="row"><button class="btn" data-a="copyTxt">Copy</button>'+'<button class="btn p" data-a="dlJson" data-v="'+c.id+'">Download .json</button>'+'</div>');break}

function applyFee(c){const r=c.feeReq;r.state='approved';if(r.type==='Free filing'){c.fee=0}else if(r.type==='Discount'){c.fee=r.amount}else if(r.type==='Pay after filing'){c.credit=true}log('Approved fee change ('+r.type+') for '+c.f.name,'Owner')}

document.addEventListener('change',async e=>{
  const el=e.target;const a=el.dataset.a,v=el.dataset.v;const c=v?C(v):null;

  if(a==='active'){const t=DB.team[+v];if(t){t.active=el.checked;log((el.checked?'Switched on':'Switched off')+' access for '+t.email,'Owner');save()}return}

  if(a==='upload'&&c){if(LIVE){uploadFiles(c,[...el.files],'doc');return}[...el.files].forEach(f=>c.docs.push({n:f.name,d:now()}));log('Uploaded '+el.files.length+' file(s) for '+c.f.name,S.role==='client'?'Client · '+c.f.name:undefined);save();toast('Uploaded (demo stores file names only)');return}
  if(a==='itrv'&&c&&el.files[0]){if(LIVE){uploadFiles(c,[el.files[0]],'itrv');return}c.itrv=el.files[0].name;log('Attached ITR-V for '+c.f.name);save();return}
  if(a==='prefill'&&c&&el.files[0]){
    try{const txt=await el.files[0].text();const j=JSON.parse(txt);const g=parsePrefill(j);
      readF(c);
      if(g.pan)c.f.pan=g.pan;if(g.first||g.last)c.f.name=[g.first,g.last].filter(Boolean).join(' ');if(g.email)c.f.email=g.email;
      ['salary','savingsInt','fdInt','tds','dividend'].forEach(k=>{if(g[k]!=null)c.f[k]=g[k]});
      if(g.dob){const y=parseInt(String(g.dob).slice(0,4))||parseInt(String(g.dob).slice(-4));if(y){const age=2027-y;c.f.age=age>=80?'80plus':age>=60?'60to79':'below60'}}
      const keys=Object.keys(g);c.prefill=true;c.prefillInfo=keys.length?'found '+keys.join(', '):'file read, but no known fields matched: enter figures manually';
      log('Imported prefill JSON for '+c.f.name+' ('+keys.length+' fields)');save();toast(keys.length?'Prefill imported: check the figures':'No known fields found');
    }catch(err){toast('Not a valid JSON file')}
  }
});
